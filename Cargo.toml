[package]
name = "notify-action"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.6"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
